<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021c2f" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="100" y1="50" x2="500" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad)" />
  <rect width="600" height="340" fill="url(#grid)" />
  <rect width="600" height="340" fill="url(#glow)" />

  <!-- Abstract System Architecture Nodes & Flow -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <path d="M 120 170 H 250 L 300 120 H 420" />
    <path d="M 250 170 L 300 220 H 420" />
    <path d="M 180 110 V 230" />
    <path d="M 420 120 L 480 170" />
    <path d="M 420 220 L 480 170" />
  </g>

  <!-- Central Processing Emblem -->
  <g transform="translate(300, 170)">
    <circle r="44" fill="#0f172a" stroke="#2dd4bf" stroke-width="2" filter="url(#softGlow)" />
    <circle r="36" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 3" opacity="0.8" />
    <!-- Neural Net / AI Code Icon -->
    <path d="M -16 -8 L 0 -20 L 16 -8 L 16 12 L 0 20 L -16 12 Z" fill="none" stroke="#5eead4" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#2dd4bf" />
    <circle cx="-16" cy="-8" r="3" fill="#38bdf8" />
    <circle cx="16" cy="-8" r="3" fill="#38bdf8" />
    <circle cx="0" cy="-20" r="3" fill="#5eead4" />
    <circle cx="-16" cy="12" r="3" fill="#38bdf8" />
    <circle cx="16" cy="12" r="3" fill="#38bdf8" />
    <circle cx="0" cy="20" r="3" fill="#5eead4" />
  </g>

  <!-- Left Input Node -->
  <circle cx="120" cy="170" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="120" cy="170" r="4" fill="#38bdf8" />

  <!-- Right Output Node -->
  <circle cx="480" cy="170" r="14" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="480" cy="170" r="4" fill="#2dd4bf" />

  <!-- Sub Nodes -->
  <circle cx="180" cy="110" r="5" fill="#38bdf8" opacity="0.7" />
  <circle cx="180" cy="230" r="5" fill="#38bdf8" opacity="0.7" />
  <circle cx="420" cy="120" r="6" fill="#2dd4bf" opacity="0.8" />
  <circle cx="420" cy="220" r="6" fill="#2dd4bf" opacity="0.8" />

  <!-- Bottom Label -->
  <text x="300" y="275" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="3" text-anchor="middle" text-transform="uppercase">
    System Architecture &amp; Code
  </text>
  <text x="300" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#5eead4" letter-spacing="1.5" text-anchor="middle">
    Production Ready Pipeline
  </text>
</svg>
